<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>내 혈압 기록</title>
<style>
  :root{
    --sys:#E5484D; --dia:#2F6FED; --pulse:#16A34A;
    --ink:#1A2230; --muted:#667085; --line:#E6E9EF;
    --bg:#F4F6FA; --card:#FFFFFF; --accent:#2F6FED; --good:#16A34A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    font-size:18px; padding:16px; max-width:560px; margin:0 auto;
  }
  h1{font-size:26px; font-weight:800; margin:4px 0 2px; text-align:center}
  .sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 4px 14px rgba(30,40,70,.05)}
  .card h2{font-size:18px; font-weight:800; margin:0 0 12px; display:flex; align-items:baseline; gap:8px}
  .card h2 small{font-size:13px; color:var(--muted); font-weight:700}
  label{display:block; font-size:15px; font-weight:700; color:var(--muted); margin:10px 0 4px}
  input, textarea{
    width:100%; font-size:19px; padding:13px 14px; border:1.5px solid var(--line);
    border-radius:12px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus, textarea:focus{outline:none; border-color:var(--accent)}
  textarea{resize:vertical; min-height:52px}
  .row{display:flex; gap:10px}
  .row > div{flex:1}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:12px; font-weight:800}
  .add{flex:1; margin-top:0; padding:16px; font-size:20px; background:var(--accent); color:#fff}
  .add:active{transform:scale(.99)}
  .add.editing{background:var(--good)}
  .btnrow{display:flex; gap:10px; margin-top:16px}
  .cancel{padding:16px 18px; font-size:17px; background:#EEF1F6; color:var(--muted)}
  .stats{display:flex; gap:10px; text-align:center}
  .stat{flex:1; background:#F7F9FC; border-radius:12px; padding:12px 6px}
  .stat .v{font-size:26px; font-weight:800; line-height:1.1}
  .stat .v small{font-size:13px; font-weight:700; color:var(--muted)}
  .stat .k{font-size:13px; color:var(--muted); margin-top:3px}
  .legend{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; font-size:13px; font-weight:700; margin-bottom:6px}
  .dot{display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:middle; margin-right:5px}
  .swatch{display:inline-block; width:14px; height:10px; border-radius:3px; vertical-align:middle; margin-right:5px; background:var(--good); opacity:.5}
  svg{width:100%; height:auto; display:block}
  .empty{color:var(--muted); text-align:center; padding:26px 0; font-size:16px}
  .rec{display:flex; align-items:center; gap:8px; padding:12px 0; border-top:1px solid var(--line)}
  .rec:first-child{border-top:none}
  .rec.hl{background:#FFFDEB; border-radius:10px; padding-left:8px; padding-right:8px}
  .rec .d{font-weight:800; font-size:16px; min-width:62px}
  .rec .bp{font-size:20px; font-weight:800}
  .rec .bp small{font-size:13px; color:var(--muted); font-weight:700}
  .rec .grow{flex:1; min-width:0}
  .rec .memo{font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mini{padding:9px 11px; font-size:14px}
  .edit{background:#EAF0FF; color:#2456C8}
  .del{background:#FDECEC; color:#C0292E}
  .note{font-size:12px; color:var(--muted); text-align:center; margin-top:8px}
  .clear{background:none; color:var(--muted); font-size:13px; text-decoration:underline; padding:6px}
  .backup{display:flex; gap:10px}
  .backup button{flex:1; padding:15px; font-size:16px; background:#F7F9FC; color:var(--ink); border:1.5px solid var(--line)}
  .backup button:active{transform:scale(.99)}
</style>
</head>
<body>

<h1>❤️ 내 혈압 기록</h1>
<div class="sub">참고용 기록이며 의료 진단·조언이 아닙니다 · 데이터는 이 휴대폰/브라우저에만 저장됩니다</div>

<div class="card">
  <h2>최근 7일 평균 <small id="avgRange"></small></h2>
  <div class="stats">
    <div class="stat"><div class="v" id="avgSys" style="color:var(--sys)">–</div><div class="k">수축기</div></div>
    <div class="stat"><div class="v" id="avgDia" style="color:var(--dia)">–</div><div class="k">이완기</div></div>
    <div class="stat"><div class="v" id="avgPulse" style="color:var(--pulse)">–</div><div class="k">맥박</div></div>
  </div>
</div>

<div class="card">
  <h2 id="formTitle">오늘 혈압 입력</h2>
  <label for="date">날짜</label>
  <input type="date" id="date">
  <div class="row">
    <div>
      <label for="sys">수축기 (높은 값)</label>
      <input type="number" id="sys" inputmode="numeric" placeholder="예: 120">
    </div>
    <div>
      <label for="dia">이완기 (낮은 값)</label>
      <input type="number" id="dia" inputmode="numeric" placeholder="예: 80">
    </div>
  </div>
  <label for="pulse">맥박 (선택)</label>
  <input type="number" id="pulse" inputmode="numeric" placeholder="예: 70">
  <label for="memo">메모 (선택)</label>
  <textarea id="memo" placeholder="예: 아침 식전, 약 복용 후 등"></textarea>
  <div class="btnrow">
    <button class="add" id="addBtn">기록 추가하기</button>
    <button class="cancel" id="cancelBtn" hidden>취소</button>
  </div>
</div>

<div class="card">
  <h2>변화 그래프</h2>
  <div class="legend">
    <span><span class="dot" style="background:var(--sys)"></span>수축기</span>
    <span><span class="dot" style="background:var(--dia)"></span>이완기</span>
    <span><span class="swatch"></span>정상 범위 띠(80~120)</span>
  </div>
  <div id="chart"></div>
  <div class="note">초록 띠 = 수축기 120 / 이완기 80 기준선 사이. 개인차가 있으니 참고만 하세요.</div>
</div>

<div class="card">
  <h2>전체 기록 <small id="count"></small></h2>
  <div id="list"></div>
  <div style="text-align:center"><button class="clear" id="clearBtn" hidden>전체 기록 지우기</button></div>
</div>

<div class="card">
  <h2>백업 (기기 바꿀 때)</h2>
  <div class="backup">
    <button id="exportBtn">⬇ 내보내기(저장)</button>
    <button id="importBtn">⬆ 불러오기</button>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <div class="note">'내보내기'로 백업 파일을 저장 → 새 기기에서 '불러오기'로 그 파일을 선택하면 기록이 옮겨집니다.</div>
</div>

<script>
const KEY='bp_records_v1';
const $=id=>document.getElementById(id);
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
let records=load();
let editingId=null;

function todayStr(){const d=new Date();const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function addDays(str,n){const d=new Date(str+'T00:00:00');d.setDate(d.getDate()+n);const z=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
$('date').value=todayStr();

$('addBtn').addEventListener('click',()=>{
  const date=$('date').value;
  const sys=parseInt($('sys').value,10);
  const dia=parseInt($('dia').value,10);
  const pulse=$('pulse').value===''?null:parseInt($('pulse').value,10);
  const memo=$('memo').value.trim();
  if(!date){alert('날짜를 선택해 주세요.');return;}
  if(!Number.isFinite(sys)||!Number.isFinite(dia)){alert('수축기와 이완기 값을 숫자로 입력해 주세요.');return;}
  if(editingId){
    const r=records.find(x=>x.id===editingId);
    if(r){r.date=date;r.sys=sys;r.dia=dia;r.pulse=pulse;r.memo=memo;}
    editingId=null;
  }else{
    records.push({id:Date.now(),date,sys,dia,pulse,memo});
  }
  save(records);
  resetForm();
  render();
});

$('cancelBtn').addEventListener('click',resetForm);

function resetForm(){
  editingId=null;
  $('sys').value='';$('dia').value='';$('pulse').value='';$('memo').value='';
  $('date').value=todayStr();
  $('formTitle').textContent='오늘 혈압 입력';
  $('addBtn').textContent='기록 추가하기';
  $('addBtn').classList.remove('editing');
  $('cancelBtn').hidden=true;
}

function edit(id){
  const r=records.find(x=>x.id===id); if(!r)return;
  editingId=id;
  $('date').value=r.date; $('sys').value=r.sys; $('dia').value=r.dia;
  $('pulse').value=(r.pulse??''); $('memo').value=r.memo||'';
  $('formTitle').textContent='기록 수정 중';
  $('addBtn').textContent='수정 저장';
  $('addBtn').classList.add('editing');
  $('cancelBtn').hidden=false;
  document.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'});
  $('formTitle').scrollIntoView({behavior:'smooth',block:'center'});
}

function del(id){
  if(confirm('이 기록을 삭제할까요?')){
    records=records.filter(r=>r.id!==id);
    if(editingId===id)resetForm();
    save(records);render();
  }
}

$('clearBtn').addEventListener('click',()=>{
  if(confirm('모든 혈압 기록을 지울까요? 되돌릴 수 없습니다.')){records=[];resetForm();save(records);render();}
});

// 내보내기
$('exportBtn').addEventListener('click',()=>{
  if(!records.length){alert('내보낼 기록이 없습니다.');return;}
  const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='혈압기록_백업_'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
// 불러오기
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data))throw new Error('형식 오류');
      const added=mergeRecords(data);
      save(records);render();
      alert(added+'개의 기록을 불러왔습니다. (중복 제외)');
    }catch(err){alert('불러오기 실패: 올바른 백업 파일이 아닙니다.');}
    $('importFile').value='';
  };
  reader.readAsText(file);
});
function mergeRecords(data){
  const have=new Set(records.map(r=>r.id));
  let added=0;
  data.forEach(r=>{
    if(r&&r.date&&Number.isFinite(+r.sys)&&Number.isFinite(+r.dia)){
      let id=r.id||Date.now()+Math.floor(Math.random()*1000);
      if(have.has(id))return;
      records.push({id,date:r.date,sys:+r.sys,dia:+r.dia,pulse:(r.pulse==null||r.pulse==='')?null:+r.pulse,memo:r.memo||''});
      have.add(id);added++;
    }
  });
  return added;
}

function avg(arr){return arr.length?Math.round(arr.reduce((s,v)=>s+v,0)/arr.length):null;}

function render(){
  const sorted=[...records].sort((a,b)=>a.date.localeCompare(b.date));
  // 최근 7일 평균 (가장 최근 기록일 기준 7일 창)
  if(sorted.length){
    const anchor=sorted[sorted.length-1].date;
    const cutoff=addDays(anchor,-6);
    const win=sorted.filter(r=>r.date>=cutoff);
    $('avgSys').textContent=avg(win.map(r=>r.sys))??'–';
    $('avgDia').textContent=avg(win.map(r=>r.dia))??'–';
    const pulses=win.map(r=>r.pulse).filter(v=>Number.isFinite(v));
    $('avgPulse').textContent=pulses.length?avg(pulses):'–';
    $('avgRange').textContent='('+fmtDate(cutoff)+'~'+fmtDate(anchor)+' · '+win.length+'회)';
  }else{
    $('avgSys').textContent=$('avgDia').textContent=$('avgPulse').textContent='–';
    $('avgRange').textContent='';
  }
  // 그래프
  $('chart').innerHTML=chartSVG(sorted);
  // 목록 (최신→오래된)
  const list=$('list');
  const desc=[...records].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('count').textContent=records.length?('· '+records.length+'개'):'';
  $('clearBtn').hidden=records.length===0;
  if(!desc.length){list.innerHTML='<div class="empty">아직 기록이 없어요.<br>위에서 첫 혈압을 입력해 보세요!</div>';return;}
  list.innerHTML=desc.map(r=>{
    const p=Number.isFinite(r.pulse)?(' · 맥박 '+r.pulse):'';
    const m=r.memo?('<div class="memo">'+esc(r.memo)+'</div>'):'';
    const hl=(r.id===editingId)?' hl':'';
    return '<div class="rec'+hl+'"><div class="d">'+fmtDate(r.date)+'</div>'+
      '<div class="grow"><div class="bp"><span style="color:var(--sys)">'+r.sys+'</span> / <span style="color:var(--dia)">'+r.dia+'</span> <small>mmHg'+p+'</small></div>'+m+'</div>'+
      '<button class="mini edit" onclick="edit('+r.id+')">수정</button>'+
      '<button class="mini del" onclick="del('+r.id+')">삭제</button></div>';
  }).join('');
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){const [y,m,dd]=d.split('-');return m+'.'+dd;}

function chartSVG(data){
  const W=380,H=260, padL=40,padR=14,padT=16,padB=40;
  const pw=W-padL-padR, ph=H-padT-padB;
  if(!data.length) return '<div class="empty">기록이 쌓이면 그래프가 그려져요.</div>';
  let yMax=200, yMin=40;
  const allv=data.flatMap(r=>[r.sys,r.dia]);
  yMax=Math.max(200, Math.ceil((Math.max(...allv)+10)/20)*20);
  yMin=Math.min(40, Math.floor((Math.min(...allv)-10)/20)*20);
  const X=i=>data.length===1?padL+pw/2:padL+pw*i/(data.length-1);
  const Y=v=>padT+ph*(1-(v-yMin)/(yMax-yMin));
  let g='';
  // 정상 범위 띠 (80~120) — 맨 뒤에 옅게
  const bandTop=Y(120), bandBot=Y(80);
  g+='<rect x="'+padL+'" y="'+bandTop+'" width="'+pw+'" height="'+(bandBot-bandTop)+'" fill="#16A34A" opacity="0.10"/>';
  // y 격자 + 라벨
  for(let v=yMin; v<=yMax; v+=20){
    const y=Y(v);
    g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#EEF1F6" stroke-width="1"/>';
    g+='<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#9AA3B2">'+v+'</text>';
  }
  // 기준선 (120 수축기 / 80 이완기)
  [[120,'#E5484D'],[80,'#2F6FED']].forEach(([v,c])=>{
    if(v>=yMin&&v<=yMax){const y=Y(v);
      g+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="'+c+'" stroke-width="1" stroke-dasharray="3 4" opacity="0.55"/>';
      g+='<text x="'+(W-padR)+'" y="'+(y-3)+'" text-anchor="end" font-size="10" fill="'+c+'" opacity="0.8">'+v+'</text>';
    }
  });
  // x 라벨 (최대 5개)
  const step=Math.max(1,Math.ceil(data.length/5));
  data.forEach((r,i)=>{ if(i%step===0||i===data.length-1){ g+='<text x="'+X(i)+'" y="'+(H-14)+'" text-anchor="middle" font-size="11" fill="#9AA3B2">'+fmtDate(r.date)+'</text>'; }});
  // 선
  const line=(key,color)=>{
    if(data.length>1){
      const pts=data.map((r,i)=>X(i)+','+Y(r[key])).join(' ');
      g+='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    data.forEach((r,i)=>{ g+='<circle cx="'+X(i)+'" cy="'+Y(r[key])+'" r="3.5" fill="'+color+'"/>'; });
  };
  line('dia','#2F6FED'); line('sys','#E5484D');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="혈압 변화 그래프">'+g+'</svg>';
}

render();
</script>
</body>
</html>
